name: WakaTime Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Update README with WakaTime statistics
        uses: athul/waka-readme@master

        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SHOW_TITLE: true
          SECTION_NAME: waka

          TIME_RANGE: last_30_days
          LANG_COUNT: 8

          SHOW_TIME: true
          SHOW_TOTAL: true

          STOP_AT_OTHER: false

          COMMIT_MESSAGE: "chore: update WakaTime metrics"
