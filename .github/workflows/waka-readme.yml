name: Profile Metrics

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/waka-readme.yml"

  schedule:
    # 03:00 UTC = aproximadamente 00:00 em Brasília (UTC-3)
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:

  update-metrics:

    name: Generate profile metrics

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Generate WakaTime and GitHub SVG cards

        env:

          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          GH_TOKEN: ${{ github.token }}

          GITHUB_LOGIN: CFSJCODE

        run: |

          python3 - <<'PY'

          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          from pathlib import Path
          from xml.sax.saxutils import escape


          # ============================================================
          # CONFIGURAÇÕES
          # ============================================================

          ASSETS = Path("assets")

          ASSETS.mkdir(
              exist_ok=True
          )


          W = 920


          FONT = (
              "-apple-system,"
              "BlinkMacSystemFont,"
              "'Segoe UI',"
              "Helvetica,"
              "Arial,"
              "sans-serif"
          )


          MONO = (
              "ui-monospace,"
              "SFMono-Regular,"
              "Consolas,"
              "'Liberation Mono',"
              "monospace"
          )


          COLORS = {

              "TypeScript": "#3178C6",

              "JavaScript": "#F1E05A",

              "C++": "#00599C",

              "C": "#555555",

              "Python": "#3776AB",

              "Dart": "#0175C2",

              "Markdown": "#083FA1",

              "PowerShell": "#5391FE",

              "HTML": "#E34C26",

              "CSS": "#563D7C",

              "Shell": "#89E051",

              "Java": "#B07219",

              "Kotlin": "#A97BFF",

              "Rust": "#DEA584",

              "Go": "#00ADD8",

              "PHP": "#4F5D95",

              "JSON": "#6E7681",

              "Other": "#6E7681",

          }


          # ============================================================
          # ESTILO DOS CARDS
          # ============================================================

          def style_block():

              return f"""

              <style>

                .bg {{
                  fill: #ffffff;
                  stroke: #d0d7de;
                }}

                .title {{
                  fill: #1f2328;
                  font-family: {FONT};
                  font-weight: 700;
                }}

                .text {{
                  fill: #24292f;
                  font-family: {FONT};
                }}

                .muted {{
                  fill: #656d76;
                  font-family: {FONT};
                }}

                .mono {{
                  fill: #24292f;
                  font-family: {MONO};
                }}

                .track {{
                  fill: #eaeef2;
                }}

                .box {{
                  fill: #f6f8fa;
                  stroke: #d8dee4;
                }}


                @media (prefers-color-scheme: dark) {{

                  .bg {{
                    fill: #0d1117;
                    stroke: #30363d;
                  }}

                  .title {{
                    fill: #f0f6fc;
                  }}

                  .text {{
                    fill: #c9d1d9;
                  }}

                  .muted {{
                    fill: #8b949e;
                  }}

                  .mono {{
                    fill: #c9d1d9;
                  }}

                  .track {{
                    fill: #21262d;
                  }}

                  .box {{
                    fill: #161b22;
                    stroke: #30363d;
                  }}

                }}

              </style>

              """


          # ============================================================
          # DATA
          # ============================================================

          def fmt_date(value):

              raw = str(
                  value or ""
              )[:10]


              parts = raw.split("-")


              if len(parts) == 3:

                  return (
                      f"{parts[2]}/"
                      f"{parts[1]}/"
                      f"{parts[0]}"
                  )


              return raw


          # ============================================================
          # HTTP / JSON
          # ============================================================

          def request_json(
              url,
              headers=None,
              timeout=30
          ):

              request = urllib.request.Request(
                  url
              )


              for key, value in (
                  headers or {}
              ).items():

                  request.add_header(
                      key,
                      value
                  )


              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  return json.load(
                      response
                  )


          # ============================================================
          # GERADOR SVG
          # ============================================================

          def write_svg(
              name,
              body,
              height
          ):

              svg = f'''

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="{W}"
                height="{height}"
                viewBox="0 0 {W} {height}"
                role="img"
              >

              {style_block()}

              <rect
                class="bg"
                x="0.5"
                y="0.5"
                width="{W - 1}"
                height="{height - 1}"
                rx="12"
              />

              {body}

              </svg>

              '''


              (
                  ASSETS / name
              ).write_text(

                  svg,

                  encoding="utf-8",

                  newline="\n"

              )


          # ============================================================
          # WAKATIME
          # ============================================================

          waka_key = os.environ.get(

              "WAKATIME_API_KEY",

              ""

          ).strip()


          if not waka_key:

              raise SystemExit(

                  "Secret WAKATIME_API_KEY "
                  "não configurado."

              )


          basic = base64.b64encode(

              waka_key.encode(
                  "utf-8"
              )

          ).decode(
              "ascii"
          )


          waka = request_json(

              "https://wakatime.com/api/v1/"
              "users/current/stats/last_30_days",

              headers={

                  "Authorization":
                      f"Basic {basic}",

                  "Accept":
                      "application/json",

                  "User-Agent":
                      "CFSJCODE-Profile-Metrics",

              },

          ).get(
              "data",
              {}
          )


          languages = waka.get(

              "languages",

              []

          )[:8]


          total = (

              waka.get(
                  "human_readable_total_including_other_language"
              )

              or

              waka.get(
                  "human_readable_total"
              )

              or

              "0 secs"

          )


          start = fmt_date(
              waka.get("start")
          )


          end = fmt_date(
              waka.get("end")
          )


          # ============================================================
          # CARD WAKATIME
          # ============================================================

          row_h = 50


          height = (

              128

              +

              max(
                  1,
                  len(languages)
              )

              * row_h

              +

              28

          )


          parts = [

              '<text class="title" '
              'x="30" y="36" '
              'font-size="20">'
              'WakaTime — Atividade de Desenvolvimento'
              '</text>',

              f'<text class="muted" '
              f'x="30" y="61" '
              f'font-size="13">'
              f'{escape(start)} — {escape(end)} '
              f'· últimos 30 dias'
              f'</text>',

              '<rect class="box" '
              'x="690" y="22" '
              'width="200" '
              'height="58" '
              'rx="9"/>',

              '<text class="muted" '
              'x="708" y="43" '
              'font-size="10" '
              'font-weight="600">'
              'TEMPO TOTAL RASTREADO'
              '</text>',

              f'<text class="title" '
              f'x="708" y="66" '
              f'font-size="17">'
              f'{escape(total)}'
              f'</text>',

          ]


          if not languages:

              parts.append(

                  '<text class="muted" '
                  'x="30" y="120" '
                  'font-size="14">'
                  'Nenhuma atividade registrada no período.'
                  '</text>'

              )


          else:

              max_bar = 430


              for i, lang in enumerate(
                  languages
              ):

                  y = (
                      112
                      +
                      i * row_h
                  )


                  name = str(

                      lang.get(
                          "name",
                          "Unknown"
                      )

                  )


                  duration = str(

                      lang.get(
                          "text",
                          "0 secs"
                      )

                  )


                  percent = max(

                      0.0,

                      min(

                          100.0,

                          float(

                              lang.get(
                                  "percent",
                                  0
                              )

                              or 0

                          )

                      )

                  )


                  color = COLORS.get(

                      name,

                      "#6E7681"

                  )


                  if percent > 0:

                      fill_w = max(

                          2,

                          max_bar
                          * percent
                          / 100.0

                      )

                  else:

                      fill_w = 0


                  parts.extend([

                      f'<circle '
                      f'cx="38" '
                      f'cy="{y + 7}" '
                      f'r="5" '
                      f'fill="{color}"/>',

                      f'<text class="text" '
                      f'x="52" '
                      f'y="{y + 12}" '
                      f'font-size="13" '
                      f'font-weight="600">'
                      f'{escape(name)}'
                      f'</text>',

                      f'<text class="muted" '
                      f'x="190" '
                      f'y="{y + 12}" '
                      f'font-size="12">'
                      f'{escape(duration)}'
                      f'</text>',

                      f'<rect class="track" '
                      f'x="330" '
                      f'y="{y}" '
                      f'width="{max_bar}" '
                      f'height="14" '
                      f'rx="7"/>',

                      f'<rect '
                      f'x="330" '
                      f'y="{y}" '
                      f'width="{fill_w:.1f}" '
                      f'height="14" '
                      f'rx="7" '
                      f'fill="{color}"/>',

                      f'<text class="mono" '
                      f'x="785" '
                      f'y="{y + 12}" '
                      f'font-size="12">'
                      f'{percent:5.2f}%'
                      f'</text>',

                  ])


          write_svg(

              "wakatime.svg",

              "\n".join(
                  parts
              ),

              height

          )


          # ============================================================
          # GITHUB
          # ============================================================

          gh_token = os.environ.get(

              "GH_TOKEN",

              ""

          ).strip()


          login = os.environ.get(

              "GITHUB_LOGIN",

              "CFSJCODE"

          ).strip()


          gh_headers = {

              "Accept":
                  "application/vnd.github+json",

              "User-Agent":
                  "CFSJCODE-Profile-Metrics",

              "X-GitHub-Api-Version":
                  "2022-11-28",

          }


          if gh_token:

              gh_headers[
                  "Authorization"
              ] = (
                  f"Bearer {gh_token}"
              )


          user = request_json(

              "https://api.github.com/users/"
              f"{urllib.parse.quote(login)}",

              gh_headers

          )


          repos = request_json(

              "https://api.github.com/users/"
              f"{urllib.parse.quote(login)}"
              "/repos"
              "?per_page=100"
              "&type=owner"
              "&sort=updated",

              gh_headers

          )


          # ============================================================
          # REPOSITÓRIOS PRÓPRIOS
          # ============================================================

          own_public = [

              repo

              for repo in repos

              if not repo.get(
                  "fork"
              )

          ]


          stars = sum(

              int(

                  repo.get(
                      "stargazers_count",
                      0
                  )

                  or 0

              )

              for repo in own_public

          )


          forks = sum(

              int(

                  repo.get(
                      "forks_count",
                      0
                  )

                  or 0

              )

              for repo in own_public

          )


          # ============================================================
          # GITHUB OVERVIEW
          # ============================================================

          overview_h = 220


          metrics = [

              (
                  "Repositórios públicos",

                  str(
                      user.get(
                          "public_repos",
                          0
                      )
                  )
              ),

              (
                  "Seguidores",

                  str(
                      user.get(
                          "followers",
                          0
                      )
                  )
              ),

              (
                  "Stars recebidas",

                  str(
                      stars
                  )
              ),

              (
                  "Forks",

                  str(
                      forks
                  )
              ),

          ]


          overview = [

              '<text class="title" '
              'x="30" y="38" '
              'font-size="20">'
              'GitHub — Visão Geral'
              '</text>',

              f'<text class="muted" '
              f'x="30" y="62" '
              f'font-size="13">'
              f'@{escape(login)} · métricas públicas'
              f'</text>',

          ]


          box_w = 202

          gap = 18


          for i, (
              label,
              value
          ) in enumerate(
              metrics
          ):

              x = (

                  30

                  +

                  i * (
                      box_w + gap
                  )

              )


              overview.extend([

                  f'<rect class="box" '
                  f'x="{x}" '
                  f'y="92" '
                  f'width="{box_w}" '
                  f'height="92" '
                  f'rx="10"/>',

                  f'<text class="muted" '
                  f'x="{x + 18}" '
                  f'y="120" '
                  f'font-size="11" '
                  f'font-weight="600">'
                  f'{escape(label.upper())}'
                  f'</text>',

                  f'<text class="title" '
                  f'x="{x + 18}" '
                  f'y="159" '
                  f'font-size="27">'
                  f'{escape(value)}'
                  f'</text>',

              ])


          write_svg(

              "github-overview.svg",

              "\n".join(
                  overview
              ),

              overview_h

          )


          # ============================================================
          # LINGUAGENS DO GITHUB
          # ============================================================

          language_totals = {}


          for repo in own_public:

              full_name = repo.get(
                  "full_name"
              )


              if not full_name:

                  continue


              encoded = urllib.parse.quote(

                  full_name,

                  safe="/"

              )


              try:

                  lang_data = request_json(

                      "https://api.github.com/repos/"
                      f"{encoded}/languages",

                      gh_headers,

                      timeout=20

                  )


              except Exception as exc:

                  print(

                      "Aviso: não foi possível "
                      "ler linguagens de "
                      f"{full_name}: {exc}"

                  )

                  continue


              for (
                  language,
                  amount
              ) in lang_data.items():

                  language_totals[
                      language
                  ] = (

                      language_totals.get(
                          language,
                          0
                      )

                      +

                      int(
                          amount or 0
                      )

                  )


          total_bytes = sum(

              language_totals.values()

          )


          top = sorted(

              language_totals.items(),

              key=lambda item:
                  item[1],

              reverse=True

          )[:8]


          # ============================================================
          # CARD DE LINGUAGENS
          # ============================================================

          lang_h = (

              128

              +

              max(
                  1,
                  len(top)
              )

              * row_h

              +

              28

          )


          lang_parts = [

              '<text class="title" '
              'x="30" y="36" '
              'font-size="20">'
              'GitHub — Linguagens dos Repositórios'
              '</text>',

              '<text class="muted" '
              'x="30" y="61" '
              'font-size="13">'
              'Distribuição agregada por bytes '
              '· repositórios públicos próprios '
              '· forks excluídos'
              '</text>',

          ]


          if (
              not top
              or total_bytes <= 0
          ):

              lang_parts.append(

                  '<text class="muted" '
                  'x="30" y="120" '
                  'font-size="14">'
                  'Nenhum dado de linguagem disponível.'
                  '</text>'

              )


          else:

              max_bar = 430


              for i, (
                  name,
                  amount
              ) in enumerate(
                  top
              ):

                  y = (

                      112

                      +

                      i * row_h

                  )


                  percent = (

                      amount
                      * 100.0
                      / total_bytes

                  )


                  color = COLORS.get(

                      name,

                      "#6E7681"

                  )


                  if percent > 0:

                      fill_w = max(

                          2,

                          max_bar
                          * percent
                          / 100.0

                      )

                  else:

                      fill_w = 0


                  lang_parts.extend([

                      f'<circle '
                      f'cx="38" '
                      f'cy="{y + 7}" '
                      f'r="5" '
                      f'fill="{color}"/>',

                      f'<text class="text" '
                      f'x="52" '
                      f'y="{y + 12}" '
                      f'font-size="13" '
                      f'font-weight="600">'
                      f'{escape(name)}'
                      f'</text>',

                      f'<rect class="track" '
                      f'x="250" '
                      f'y="{y}" '
                      f'width="{max_bar}" '
                      f'height="14" '
                      f'rx="7"/>',

                      f'<rect '
                      f'x="250" '
                      f'y="{y}" '
                      f'width="{fill_w:.1f}" '
                      f'height="14" '
                      f'rx="7" '
                      f'fill="{color}"/>',

                      f'<text class="mono" '
                      f'x="710" '
                      f'y="{y + 12}" '
                      f'font-size="12">'
                      f'{percent:5.2f}%'
                      f'</text>',

                  ])


          write_svg(

              "github-languages.svg",

              "\n".join(
                  lang_parts
              ),

              lang_h

          )


          print(

              f"WakaTime: "
              f"{len(languages)} linguagens, "
              f"total {total}"

          )


          print(

              f"GitHub: "
              f"{len(own_public)} "
              f"repositórios públicos próprios"

          )


          print(
              "SVGs gerados em ./assets"
          )


          PY


      - name: Commit generated metrics

        run: |

          # git status --porcelain detecta tanto
          # arquivos novos quanto arquivos modificados.

          if [ -z "$(git status --porcelain -- assets/)" ]; then

            echo "Métricas já estão atualizadas."

            exit 0

          fi


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/


          git commit \
            -m "chore: update profile metrics"


          git push
